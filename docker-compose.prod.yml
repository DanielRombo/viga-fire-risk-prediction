version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: viga_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - viga_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    container_name: viga_backend_prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      NASA_FIRMS_KEY: ${NASA_FIRMS_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - viga_network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.prod
    container_name: viga_frontend_prod
    restart: always
    networks:
      - viga_network

  nginx:
    image: nginx:alpine
    container_name: viga_nginx_prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - viga_network

volumes:
  postgres_data_prod:

networks:
  viga_network:
    driver: bridge
